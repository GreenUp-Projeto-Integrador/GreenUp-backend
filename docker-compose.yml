services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenup}
      POSTGRES_USER: ${POSTGRES_USER:-greenup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenup}
    ports:
      - "5433:5432"
    volumes:
      - greenup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenup}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
volumes:
  greenup_postgres_data:
